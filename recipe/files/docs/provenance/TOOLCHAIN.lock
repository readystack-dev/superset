        "wheel": "apache_superset-6.1.0-py3-none-any.whl",
        "why": "apache-superset 6.1.0 declares cryptography<47, Pillow<13, pyarrow<19 and msgpack<1.1, and the CVE fixes are only outside them: cryptography GHSA-g6cj-pr64-35w5 (H, fixed 50.0.0), GHSA-jwv3-5hgf-82ww (H, 49.0.0), GHSA-537c-gmf6-5ccf (H, 48.0.1), GHSA-m2h6-j472-rp4c (M); Pillow GHSA-8g5g-8vmr-9782 (C) and GHSA-58r4-6rv3-gfh8, -pchr-8j38-3x4p, -c6hw-5grf-ff96, -65qm-jvmh-6pqg, -p4wg-p73j-c528, -q45j-58j2-45rg (H), all fixed only in 13.0.0; pyarrow GHSA-rgxp-2hwp-jwgg (H, 23.0.1); msgpack GHSA-6v7p-g79w-8964 (H, 1.2.1). Upstream master has moved all four past these ceilings (cryptography>=50.0.2,<51; Pillow>=13.0.0,<14; pyarrow>=26,<27; msgpack>=1.2.3,<1.3). Each new range is bounded to the major (minor for msgpack) that was tested. TESTED 2026-10-22 on the controller, CPython 3.12, against upstream's own pins as the control (same 159-package set, only these libraries and their pyOpenSSL/certifi/setuptools neighbours different): Superset's own unit suite (tests/common + tests/unit_tests at the 6.1.0 tag, 5,070 tests: the same outcome for every test on both sets, 4,968 passing; the 76 failures and 22 errors are identical on both and come from optional modules the image does not ship -- fastmcp, the BigQuery/Trino/Presto drivers, prophet -- or from tests that read the source checkout) and a booted instance on PostgreSQL 16 driven through the REST API -- login, a database with an encrypted password, SQL Lab (250 rows of int/decimal/text/date/timestamp/timestamptz/array/json/bool/null, CSV export), a dataset, chart data as json/csv/xlsx and with pivot/rolling post-processing, a saved chart, a dashboard and its export, CSV upload -- gave identical results on both sets; in-process, SupersetResultSet (pyarrow), the Arrow IPC + msgpack results payload round trip, screenshot tiling, thumbnail resize and PDF building (Pillow), Fernet/EncryptedType, paramiko keys, sshtunnel and pyOpenSSL also matched. The code paths Superset uses (PIL Image.open/new/resize with Resampling.LANCZOS; pa.array/Table/ipc/parquet/ArrowSerializationError; msgpack dumps/loads with use_bin_type) exist unchanged in the new versions."
      }
